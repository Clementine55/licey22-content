<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Обновления сайта лицея №22</title>
<style>
  :root {
    --paper: #F5F3EC;
    --paper-line: #DEDACB;
    --ink: #232620;
    --ink-soft: #6B6A5E;
    --green: #2F4A3D;
    --green-soft: #E4ECE6;
    --gold: #A9782E;
    --gold-soft: #F3E7CE;
    --rust: #A6432E;
    --rust-soft: #F5E1DC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  .page {
    max-width: 760px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: 30px;
    margin: 0 0 4px;
    letter-spacing: 0.2px;
  }
  .subtitle {
    color: var(--ink-soft);
    font-size: 15px;
    margin: 0 0 28px;
  }
  .status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    border: 1px solid var(--paper-line);
    border-radius: 6px;
    padding: 16px 20px;
    margin-bottom: 36px;
    background: #FBFAF6;
  }
  .status-text { font-size: 15px; }
  .status-text .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 8px;
    background: var(--green);
    position: relative;
    top: -1px;
  }
  .status-text.error .dot { background: var(--rust); }
  .status-time { color: var(--ink-soft); font-size: 14px; margin-top: 2px; }
  button#update-btn {
    font-family: inherit;
    font-size: 15px;
    padding: 10px 18px;
    border-radius: 5px;
    border: 1px solid var(--green);
    background: var(--green);
    color: #F5F3EC;
    cursor: pointer;
    white-space: nowrap;
  }
  button#update-btn:hover { background: #253c31; }
  button#update-btn:disabled {
    background: transparent;
    color: var(--ink-soft);
    border-color: var(--paper-line);
    cursor: default;
  }
  .entry {
    border-top: 1px solid var(--paper-line);
    padding: 20px 0;
  }
  .entry:last-child { border-bottom: 1px solid var(--paper-line); }
  .entry-date {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 17px;
    margin-bottom: 10px;
  }
  .entry-date .warn { color: var(--rust); font-size: 14px; font-family: inherit; margin-left: 8px; }
  .change-list { list-style: none; margin: 0; padding: 0; }
  .change-list li {
    display: flex;
    gap: 10px;
    padding: 5px 0;
    font-size: 15px;
    align-items: baseline;
  }
  .tag {
    flex-shrink: 0;
    font-size: 12px;
    padding: 2px 7px;
    border-radius: 4px;
    line-height: 1.6;
  }
  .tag.added { background: var(--gold-soft); color: var(--gold); }
  .tag.updated { background: var(--green-soft); color: var(--green); }
  .tag.removed { background: var(--rust-soft); color: var(--rust); }
  .change-title a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--paper-line); }
  .change-title a:hover { border-bottom-color: var(--ink); }
  .diff-lines {
    margin: 4px 0 0 62px;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .diff-lines div { padding: 1px 0; }
  .diff-lines .plus::before { content: "+ "; color: var(--green); }
  .diff-lines .minus::before { content: "− "; color: var(--rust); }
  .no-changes { color: var(--ink-soft); font-size: 15px; }
  .empty-state { color: var(--ink-soft); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<div class="page">
  <h1>Обновления сайта лицея</h1>
  <p class="subtitle">Что менялось на старом сайте и когда — журнал автоматической проверки.</p>

  <div class="status-bar">
    <div>
      <div class="status-text" id="status-text">Загружаю…</div>
      <div class="status-time" id="status-time"></div>
    </div>
    <button id="update-btn">Обновить сейчас</button>
  </div>

  <div id="log"></div>
</div>

<script>
async function fetchJSON(url, opts) {
  const res = await fetch(url, opts);
  return res.json();
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleString("ru-RU", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
}

function renderStatus(data) {
  const textEl = document.getElementById("status-text");
  const timeEl = document.getElementById("status-time");
  const btn = document.getElementById("update-btn");

  if (data.running) {
    textEl.className = "status-text";
    textEl.innerHTML = '<span class="dot"></span>Проверяю сайт сейчас…';
    timeEl.textContent = "";
    btn.disabled = true;
    btn.textContent = "Идёт проверка…";
    return;
  }

  btn.disabled = false;
  btn.textContent = "Обновить сейчас";

  const last = data.last_run;
  if (!last) {
    textEl.className = "status-text";
    textEl.innerHTML = '<span class="dot"></span>Ещё не запускалось';
    timeEl.textContent = "";
    return;
  }

  if (last.ok) {
    textEl.className = "status-text";
    textEl.innerHTML = '<span class="dot"></span>' + last.message;
  } else {
    textEl.className = "status-text error";
    textEl.innerHTML = '<span class="dot"></span>' + last.message;
  }
  timeEl.textContent = "Последняя проверка: " + formatDate(last.finished_at || last.started_at);
}

function renderChangeItem(tag, tagLabel, title, url, diffAdded, diffRemoved) {
  const titleHtml = url
    ? '<a href="' + url + '" target="_blank" rel="noopener">' + title + '</a>'
    : title;
  let html = '<li><span class="tag ' + tag + '">' + tagLabel + '</span>'
    + '<span class="change-title">' + titleHtml + '</span></li>';
  if ((diffAdded && diffAdded.length) || (diffRemoved && diffRemoved.length)) {
    html += '<div class="diff-lines">';
    (diffAdded || []).slice(0, 3).forEach(line => {
      html += '<div class="plus">' + escapeHtml(line) + '</div>';
    });
    (diffRemoved || []).slice(0, 3).forEach(line => {
      html += '<div class="minus">' + escapeHtml(line) + '</div>';
    });
    html += '</div>';
  }
  return html;
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderLog(entries) {
  const log = document.getElementById("log");
  if (!entries.length) {
    log.innerHTML = '<div class="empty-state">Журнал пока пуст — здесь появится история после первой проверки.</div>';
    return;
  }

  log.innerHTML = entries.map(entry => {
    const total = entry.added.length + entry.updated.length + entry.removed.length;
    let body;
    if (total === 0) {
      body = '<div class="no-changes">Без изменений — проверено страниц: ' + entry.pages_found + '</div>';
    } else {
      let items = "";
      entry.added.forEach(p => items += renderChangeItem("added", "новая", p.title, p.url));
      entry.updated.forEach(p => items += renderChangeItem("updated", "обновилась", p.title, p.url, p.added_lines, p.removed_lines));
      entry.removed.forEach(p => items += renderChangeItem("removed", "пропала", p.title, p.url));
      body = '<ul class="change-list">' + items + '</ul>';
    }
    const warn = entry.healthy === false
      ? '<span class="warn">частичный сбой обхода — показаны только доступные страницы</span>'
      : '';
    return '<div class="entry"><div class="entry-date">' + formatDate(entry.timestamp) + warn + '</div>' + body + '</div>';
  }).join("");
}

async function refreshStatus() {
  const data = await fetchJSON("/api/status");
  renderStatus(data);
  return data.running;
}

async function refreshLog() {
  const entries = await fetchJSON("/api/changelog");
  renderLog(entries);
}

document.getElementById("update-btn").addEventListener("click", async () => {
  const btn = document.getElementById("update-btn");
  btn.disabled = true;
  btn.textContent = "Запускаю…";
  await fetchJSON("/api/update-now", { method: "POST" });
  poll();
});

let pollTimer = null;
async function poll() {
  const running = await refreshStatus();
  if (running) {
    pollTimer = setTimeout(poll, 3000);
  } else {
    await refreshLog();
  }
}

refreshStatus();
refreshLog();
setInterval(async () => {
  const running = await refreshStatus();
  if (running && !pollTimer) poll();
}, 10000);
</script>
</body>
</html>
