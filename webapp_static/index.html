<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Обновления сайта лицея №22</title>
<style>
  :root {
    --paper: #F5F3EC;
    --paper-line: #DEDACB;
    --ink: #232620;
    --ink-soft: #6B6A5E;
    --green: #2F4A3D;
    --green-soft: #E4ECE6;
    --gold: #A9782E;
    --gold-soft: #F3E7CE;
    --rust: #A6432E;
    --rust-soft: #F5E1DC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  .page {
    max-width: 760px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: 30px;
    margin: 0 0 4px;
    letter-spacing: 0.2px;
  }
  .subtitle {
    color: var(--ink-soft);
    font-size: 15px;
    margin: 0 0 28px;
  }
  .status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    border: 1px solid var(--paper-line);
    border-radius: 6px;
    padding: 16px 20px;
    margin-bottom: 36px;
    background: #FBFAF6;
  }
  .status-text { font-size: 15px; }
  .status-text .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 8px;
    background: var(--green);
    position: relative;
    top: -1px;
  }
  .status-text.error .dot { background: var(--rust); }
  .status-time { color: var(--ink-soft); font-size: 14px; margin-top: 2px; }
  .controls { display: flex; gap: 10px; align-items: center; }
  #panel-token {
    font-family: inherit;
    font-size: 15px;
    padding: 9px 12px;
    border-radius: 5px;
    border: 1px solid var(--paper-line);
    background: #fff;
    color: var(--ink);
    width: 130px;
  }
  #panel-token:focus { outline: none; border-color: var(--green); }
  .action-message {
    border-radius: 5px;
    padding: 12px 16px;
    margin: -20px 0 28px;
    font-size: 15px;
    background: var(--rust-soft);
    color: var(--rust);
  }
  button#update-btn {
    font-family: inherit;
    font-size: 15px;
    padding: 10px 18px;
    border-radius: 5px;
    border: 1px solid var(--green);
    background: var(--green);
    color: #F5F3EC;
    cursor: pointer;
    white-space: nowrap;
  }
  button#update-btn:hover { background: #253c31; }
  button#update-btn:disabled {
    background: transparent;
    color: var(--ink-soft);
    border-color: var(--paper-line);
    cursor: default;
  }
  .entry {
    border-top: 1px solid var(--paper-line);
    padding: 20px 0;
  }
  .entry:last-child { border-bottom: 1px solid var(--paper-line); }
  .entry-changed { background: var(--gold-soft); margin: 0 -20px; padding: 20px; border-radius: 6px; border-top: none; }
  .entry-changed + .entry { border-top: none; }
  .entry-date {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 17px;
    margin-bottom: 10px;
  }
  .entry-date .warn { color: var(--rust); font-size: 14px; font-family: inherit; margin-left: 8px; }
  details summary {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 17px;
    cursor: pointer;
    list-style: none;
    margin-bottom: 10px;
  }
  details summary::-webkit-details-marker { display: none; }
  details summary::before {
    content: "▸";
    display: inline-block;
    margin-right: 8px;
    font-size: 13px;
    color: var(--gold);
    transition: transform 0.15s;
  }
  details[open] summary::before { transform: rotate(90deg); }
  .change-count {
    font-family: inherit;
    font-size: 13px;
    color: var(--gold);
    margin-left: 10px;
  }
  .change-list { list-style: none; margin: 0; padding: 0; }
  .change-list li {
    display: flex;
    gap: 10px;
    padding: 5px 0;
    font-size: 15px;
    align-items: baseline;
  }
  .tag {
    flex-shrink: 0;
    font-size: 12px;
    padding: 2px 7px;
    border-radius: 4px;
    line-height: 1.6;
  }
  .tag.added { background: var(--gold-soft); color: var(--gold); }
  .tag.updated { background: var(--green-soft); color: var(--green); }
  .tag.removed { background: var(--rust-soft); color: var(--rust); }
  .change-title a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--paper-line); }
  .change-title a:hover { border-bottom-color: var(--ink); }
  .diff-lines {
    margin: 4px 0 0 62px;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .diff-lines div { padding: 1px 0; }
  .diff-lines .plus { color: var(--green); }
  .diff-lines .minus { color: var(--rust); }
  .no-changes { color: var(--ink-soft); font-size: 15px; }
  .empty-state { color: var(--ink-soft); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<div class="page">
  <h1>Обновления сайта лицея</h1>
  <p class="subtitle">Что менялось на старом сайте и когда — журнал автоматической проверки.</p>

  <div class="status-bar">
    <div>
      <div class="status-text" id="status-text">Загружаю…</div>
      <div class="status-time" id="status-time"></div>
    </div>
    <div class="controls" id="controls" hidden>
      <input type="password" id="panel-token" placeholder="пароль" autocomplete="current-password">
      <button id="update-btn">Обновить сейчас</button>
    </div>
  </div>

  <div id="action-message" class="action-message" hidden></div>

  <div id="log"></div>
</div>

<script>
async function fetchJSON(url, opts) {
  const res = await fetch(url, opts);
  return res.json();
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleString("ru-RU", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
}

let latestLogTimestamp = null; // синхронизирует время в статус-баре с верхней записью журнала

function renderStatus(data) {
  const textEl = document.getElementById("status-text");
  const timeEl = document.getElementById("status-time");
  const btn = document.getElementById("update-btn");
  const controls = document.getElementById("controls");

  // кнопка есть только если на сервере задан LICEY22_PANEL_TOKEN —
  // иначе панель работает в режиме "только просмотр"
  controls.hidden = !data.can_trigger;

  if (data.running) {
    textEl.className = "status-text";
    textEl.innerHTML = '<span class="dot"></span>Проверяю сайт сейчас…';
    timeEl.textContent = "";
    btn.disabled = true;
    btn.textContent = "Идёт проверка…";
    return;
  }

  btn.disabled = false;
  btn.textContent = "Обновить сейчас";

  const last = data.last_run;
  if (!last) {
    textEl.className = "status-text";
    textEl.innerHTML = '<span class="dot"></span>Ещё не запускалось';
    timeEl.textContent = "";
    return;
  }

  if (last.ok) {
    textEl.className = "status-text";
    textEl.innerHTML = '<span class="dot"></span>' + last.message;
  } else {
    textEl.className = "status-text error";
    textEl.innerHTML = '<span class="dot"></span>' + last.message;
  }
  timeEl.textContent = "Последняя проверка: " + formatDate(latestLogTimestamp || last.finished_at || last.started_at);
}

function renderChangeItem(tag, tagLabel, title, url, diffAdded, diffRemoved) {
  const safeTitle = escapeHtml(title);
  const titleHtml = url
    ? '<a href="' + url + '" target="_blank" rel="noopener">' + safeTitle + '</a>'
    : safeTitle;
  let html = '<li><span class="tag ' + tag + '">' + tagLabel + '</span>'
    + '<span class="change-title">' + titleHtml + '</span></li>';
  if ((diffAdded && diffAdded.length) || (diffRemoved && diffRemoved.length)) {
    html += '<div class="diff-lines">';
    (diffAdded || []).slice(0, 3).forEach(line => {
      html += '<div class="plus">+ ' + renderDiffLine(line) + '</div>';
    });
    (diffRemoved || []).slice(0, 3).forEach(line => {
      html += '<div class="minus">\u2212 ' + renderDiffLine(line) + '</div>';
    });
    html += '</div>';
  }
  return html;
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// diff-строки приходят как сырой Markdown страницы (из markdown_export.py) —
// раньше показывались буквально как текст, со скобками [текст](url) и
// звёздочками **bold** — уродливо и нечитаемо. Рендерим по-человечески,
// той же логикой, что и на самом сайте (см. tilda_page_block.html).
function renderDiffLine(text) {
  let html = escapeHtml(text);
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  // курсив — только в точно известном месте (meta в конце строки, см.
  // markdown_export.py: " — _{meta}_"), а не как общий поиск по всей
  // строке — иначе подчёркивания внутри URL (их там много: .../f10426_e7/...)
  // ложно считались бы началом/концом курсива
  html = html.replace(/ — _([^_]+)_$/, ' — <em>$1</em>');
  html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return html;
}

function renderLog(entries) {
  const log = document.getElementById("log");
  if (!entries.length) {
    log.innerHTML = '<div class="empty-state">Журнал пока пуст — здесь появится история после первой проверки.</div>';
    return;
  }

  log.innerHTML = entries.map(entry => {
    const total = entry.added.length + entry.updated.length + entry.removed.length;
    const warn = entry.healthy === false
      ? '<span class="warn">частичный сбой обхода — показаны только доступные страницы</span>'
      : '';
    const dateHtml = '<div class="entry-date">' + formatDate(entry.timestamp) + warn + '</div>';

    if (total === 0) {
      // ничего не изменилось — плоская строка, раскрывать нечего
      return '<div class="entry entry-empty">' + dateHtml
        + '<div class="no-changes">Ничего нового не найдено — проверено страниц: ' + entry.pages_found + '</div></div>';
    }

    let items = "";
    entry.added.forEach(p => items += renderChangeItem("added", "новая", p.title, p.url));
    entry.updated.forEach(p => items += renderChangeItem("updated", "обновилась", p.title, p.url, p.added_lines, p.removed_lines));
    entry.removed.forEach(p => items += renderChangeItem("removed", "пропала", p.title, p.url));

    // есть реальные изменения — подсвечиваем и делаем раскрывающимся
    // (open по умолчанию — свежие изменения сразу видно без клика,
    // но можно свернуть, если мешает)
    return '<div class="entry entry-changed">'
      + '<details open><summary>' + formatDate(entry.timestamp) + warn
      + '<span class="change-count">изменений: ' + total + '</span></summary>'
      + '<ul class="change-list">' + items + '</ul>'
      + '</details></div>';
  }).join("");
}

async function refreshStatus() {
  const data = await fetchJSON("/api/status");
  renderStatus(data);
  return data.running;
}

async function refreshLog() {
  const entries = await fetchJSON("/api/changelog");
  latestLogTimestamp = entries.length ? entries[0].timestamp : null;
  renderLog(entries);
  // если статус уже был отрисован раньше — перерисуем со свежим временем
  const status = await fetchJSON("/api/status");
  if (!status.running) renderStatus(status);
}

function showActionMessage(text) {
  const el = document.getElementById("action-message");
  if (!text) {
    el.hidden = true;
    return;
  }
  el.textContent = text;
  el.hidden = false;
}

document.getElementById("update-btn").addEventListener("click", async () => {
  const btn = document.getElementById("update-btn");
  const tokenInput = document.getElementById("panel-token");
  const token = tokenInput.value.trim();

  if (!token) {
    showActionMessage("Введите пароль, чтобы запустить обновление.");
    tokenInput.focus();
    return;
  }

  showActionMessage("");
  btn.disabled = true;
  btn.textContent = "Запускаю…";

  const res = await fetch("/api/update-now", {
    method: "POST",
    headers: { "X-Panel-Token": token },
  });
  const data = await res.json();

  if (!data.started) {
    showActionMessage(data.message || "Не удалось запустить обновление.");
    btn.disabled = false;
    btn.textContent = "Обновить сейчас";
    return;
  }

  poll();
});

// Enter в поле пароля = нажатие кнопки
document.getElementById("panel-token").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("update-btn").click();
});

let pollTimer = null;
async function poll() {
  const running = await refreshStatus();
  if (running) {
    pollTimer = setTimeout(poll, 3000);
  } else {
    await refreshLog();
  }
}

refreshStatus();
refreshLog();
setInterval(async () => {
  const running = await refreshStatus();
  if (running && !pollTimer) poll();
}, 10000);
</script>
</body>
</html>
